version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: vidhelp-db
    environment:
      POSTGRES_DB: vidhelp_production
      POSTGRES_USER: vidhelp_admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: vidhelp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vidhelp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    restart: unless-stopped

volumes:
  postgres_data: